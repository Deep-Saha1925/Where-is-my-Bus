spring.application.name=Where-is-My-Bus
server.port=${PORT:8080}
wimb.admin.username=${ADMIN_USERNAME}
wimb.admin.password=${ADMIN_PASSWORD}
# true = refuse to start with a weak/blank admin password (recommended in production)
wimb.security.enforce-strong-admin-password=${ENFORCE_STRONG_ADMIN_PASSWORD:false}

# ── CORS ──
# Comma-separated exact origins allowed to call the API from ANOTHER site (dev only, e.g.
# http://localhost:5500 for VS Code Live Server). Empty = same-origin only (right for production).
wimb.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# ── Driver login rate limiting (POST /api/driver/verify) ──
# Failed attempts are counted per IP, per depot and per depot+bus within the window;
# tripping any limit blocks that key for the lockout time (HTTP 429 + Retry-After).
wimb.security.login.window-seconds=${LOGIN_WINDOW_SECONDS:600}
wimb.security.login.lockout-seconds=${LOGIN_LOCKOUT_SECONDS:900}
wimb.security.login.max-failures-per-ip=${LOGIN_MAX_FAILURES_PER_IP:10}
wimb.security.login.max-failures-per-depot=${LOGIN_MAX_FAILURES_PER_DEPOT:40}
wimb.security.login.max-failures-per-bus=${LOGIN_MAX_FAILURES_PER_BUS:8}
# Proxies in front of the app whose X-Forwarded-For entries are trusted (Render = 1; add a CDN = 2).
# The header is only honoured when the connection comes from an internal/private address.
wimb.security.trusted-proxy-hops=${TRUSTED_PROXY_HOPS:1}

# ── PostgreSQL (Neon) ──
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update

# ── Connection pool (tuned for Neon's serverless Postgres) ──
# Neon's pooler drops idle connections after a few minutes. Hikari's default
# max-lifetime (30 min) is far longer than that, so it keeps handing out
# sockets the server already closed — which surfaces as SQLState 08003
# "This connection has been closed" followed by the pool draining to zero and
# every request timing out. Expiring connections well before Neon does, plus
# a keepalive ping, avoids handing out dead sockets in the first place.
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=5000

# Silences the open-in-view warning by stating the choice explicitly. Kept ON
# because the admin/route controllers serialize lazily-loaded collections
# (Route.busNumbers, Route.departureTimes) outside a transaction.
spring.jpa.open-in-view=true
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true

# ── Upstash Redis ──
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=true
spring.data.redis.timeout=2000ms

# application.properties
wimb.depot.file.path=data/depot-codes.xlsx

# Directory where admin-uploaded route Excel files are stored (outside the build)
wimb.route.dir=data/routes

# ── Swagger / OpenAPI (springdoc) ──
# UI at /swagger-ui.html, raw spec at /v3/api-docs -- both gated behind
# admin login, see SecurityConfig. Endpoints are grouped by their
# @RequestMapping base path (RideController, LocationController, etc.);
# sorted alphabetically here just so the list is easy to scan.
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=alpha
# Try-it-out is on by default; this just keeps it from persisting requests
# across page reloads, which gets confusing when testing driver-token flows.
springdoc.swagger-ui.persistAuthorization=false