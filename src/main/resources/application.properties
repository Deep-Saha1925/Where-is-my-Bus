spring.application.name=Where-is-My-Bus
server.port=${PORT:8080}
wimb.admin.username=${ADMIN_USERNAME}
wimb.admin.password=${ADMIN_PASSWORD}

# ── PostgreSQL (Neon) ──
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true

# ── Upstash Redis ──
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=true
spring.data.redis.timeout=2000ms

# application.properties
wimb.depot.file.path=data/depot-codes.xlsx

# Directory where admin-uploaded route Excel files are stored (outside the build)
wimb.route.dir=data/routes