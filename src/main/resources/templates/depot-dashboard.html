<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WIMB – Depot Dashboard</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1a1d23; --muted:#6b7280; --border:#e2e5ea; --ok:#16a34a; --warn:#d97706; --off:#9ca3af; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --card:#181b21; --text:#e8eaee; --muted:#9aa3b2; --border:#2a2f38; } }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; justify-content:space-between; align-items:center; padding:14px 20px; background:var(--card); border-bottom:1px solid var(--border); }
  main { max-width:820px; margin:20px auto; padding:0 14px; }
  .summary { display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
  .stat { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px 18px; min-width:110px; }
  .stat b { display:block; font-size:24px; }
  .bus { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px 16px; margin-bottom:10px; display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .num { font-weight:700; font-size:16px; }
  .muted { color:var(--muted); font-size:13px; }
  .pill { font-size:12px; font-weight:600; padding:3px 10px; border-radius:999px; color:#fff; align-self:center; }
  button { font:inherit; font-size:13px; font-weight:600; padding:6px 14px; border-radius:20px; border:1px solid var(--border); background:var(--card); color:var(--muted); cursor:pointer; }
</style>
</head>
<body>
<header>
  <strong id="title">🚌 Depot Dashboard</strong>
  <form action="/logout" method="post">
    <input type="hidden" name="_csrf" id="csrfToken">
    <button type="submit">Sign out</button>
  </form>
</header>
<main>
  <div class="summary">
    <div class="stat"><b id="sTotal">–</b><span class="muted">Buses</span></div>
    <div class="stat"><b id="sRunning">–</b><span class="muted">Running</span></div>
    <div class="stat"><b id="sSilent">–</b><span class="muted">Not reporting</span></div>
  </div>
  <div id="list"><div class="muted">Loading…</div></div>
  <div class="muted" id="updated" style="margin-top:8px;"></div>
</main>
<script>
fetch('/csrf-token').then(r => r.json()).then(d => { document.getElementById('csrfToken').value = d.token; });

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

async function refresh() {
  try {
    const r = await fetch('/depot/api/buses');
    if (!r.ok) throw new Error();
    const data = await r.json();
    document.getElementById('title').textContent = '🚌 ' + data.depot + ' Depot';

    const buses = data.buses;
    const running = buses.filter(b => b.running);
    const silent = running.filter(b => b.stale);
    document.getElementById('sTotal').textContent = buses.length;
    document.getElementById('sRunning').textContent = running.length;
    document.getElementById('sSilent').textContent = silent.length;

    const list = document.getElementById('list');
    list.replaceChildren();
    if (!buses.length) list.append(el('div', 'muted', 'No buses assigned to this depot yet. Ask the admin to assign them.'));

    // running first, then the rest
    buses.sort((a, b) => (b.running - a.running) || a.busNumber.localeCompare(b.busNumber));
    buses.forEach(b => {
      const row = el('div', 'bus');
      const left = el('div');
      left.append(el('div', 'num', b.busNumber));
      if (b.running) {
        let line = (b.source || '?') + ' → ' + (b.destination || '?');
        if (b.remainingDistanceKm != null) line += ' · ' + Number(b.remainingDistanceKm).toFixed(1) + ' km left';
        left.append(el('div', 'muted', line));
        if (b.stale && b.silentSeconds != null) left.append(el('div', 'muted', 'Last seen ' + Math.round(b.silentSeconds / 60) + ' min ago'));
      } else {
        left.append(el('div', 'muted', 'Not on a trip'));
      }
      const pill = el('span', 'pill', b.running ? (b.stale ? 'Not reporting' : 'Running') : 'Idle');
      pill.style.background = b.running ? (b.stale ? 'var(--warn)' : 'var(--ok)') : 'var(--off)';
      row.append(left, pill);
      list.append(row);
    });
    document.getElementById('updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
  } catch (e) {
    document.getElementById('updated').textContent = 'Could not refresh – retrying…';
  }
}
refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>
