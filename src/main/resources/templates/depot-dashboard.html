<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>WIMB – Depot Dashboard</title>
  <style>
    :root {
      --bg:#f3f5f9; --card:#ffffff; --card-2:#f8f9fc; --text:#171a21; --muted:#667085; --border:#e3e7ee;
      --ok:#16a34a; --ok-bg:#e8f7ee; --warn:#d97706; --warn-bg:#fdf2e0; --off:#8b93a3; --off-bg:#eef0f4;
      --accent:#2563eb; --accent-bg:#e8effd; --shadow:0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
      --shadow-lg:0 12px 32px rgba(16,24,40,.18);
    }
    :root[data-theme="dark"] {
      --bg:#0e1116; --card:#171b22; --card-2:#1d222b; --text:#e9ecf1; --muted:#98a2b3; --border:#2a303b;
      --ok:#34d27b; --ok-bg:#12281d; --warn:#f0a43a; --warn-bg:#2d2310; --off:#7d8696; --off-bg:#222833;
      --accent:#6ea0ff; --accent-bg:#17223a; --shadow:none; --shadow-lg:0 12px 32px rgba(0,0,0,.55);
    }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text);
      padding-bottom:env(safe-area-inset-bottom); }
    button { font:inherit; color:inherit; }

    /* ───── header ───── */
    header { position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between; gap:12px;
      padding:12px 20px; padding-top:calc(12px + env(safe-area-inset-top)); background:var(--card); border-bottom:1px solid var(--border); }
    .brand { display:flex; align-items:center; gap:10px; min-width:0; }
    .brand .logo { width:36px; height:36px; border-radius:10px; background:var(--accent-bg); display:grid; place-items:center; font-size:20px; flex:none; }
    .brand h1 { margin:0; font-size:17px; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .brand small { color:var(--muted); font-size:12px; display:flex; align-items:center; gap:6px; }
    .live { width:8px; height:8px; border-radius:50%; background:var(--ok); box-shadow:0 0 0 0 rgba(22,163,74,.5); animation:pulse 2s infinite; }
    .live.down { background:#dc2626; animation:none; }
    @keyframes pulse { 70% { box-shadow:0 0 0 7px rgba(22,163,74,0); } 100% { box-shadow:0 0 0 0 rgba(22,163,74,0); } }
    .head-actions { display:flex; gap:8px; align-items:center; }
    .btn { font-size:13px; font-weight:600; padding:7px 14px; border-radius:999px; border:1px solid var(--border); background:var(--card); color:var(--muted); cursor:pointer; }
    .btn:hover { background:var(--card-2); color:var(--text); }
    .btn.icon { width:34px; height:34px; padding:0; display:grid; place-items:center; font-size:15px; }

    main { max-width:1120px; margin:0 auto; padding:20px 16px 40px; }

    /* ───── stats ───── */
    .summary { display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; margin-bottom:18px; }
    .stat { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px 16px; box-shadow:var(--shadow); position:relative; overflow:hidden; }
    .stat::before { content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--c, var(--accent)); }
    .stat b { display:block; font-size:28px; line-height:1.1; }
    .stat span { color:var(--muted); font-size:13px; }

    /* ───── toolbar ───── */
    .toolbar { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:16px; }
    .search { flex:1 1 220px; position:relative; }
    .search input { width:100%; padding:10px 12px 10px 36px; font:inherit; font-size:14px; border-radius:12px; border:1px solid var(--border); background:var(--card); color:var(--text); }
    .search input:focus { outline:2px solid var(--accent); outline-offset:-1px; }
    .search::before { content:"🔍"; position:absolute; left:11px; top:50%; transform:translateY(-50%); font-size:14px; opacity:.6; }
    .chips { display:flex; gap:8px; flex-wrap:wrap; }
    .chip { font-size:13px; font-weight:600; padding:7px 13px; border-radius:999px; border:1px solid var(--border); background:var(--card); color:var(--muted); cursor:pointer; }
    .chip .n { margin-left:6px; font-weight:700; opacity:.75; }
    .chip[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }

    /* ───── bus cards ───── */
    .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:12px; }
    .bus { all:unset; box-sizing:border-box; display:block; cursor:pointer; background:var(--card); border:1px solid var(--border); border-radius:14px;
      padding:14px 16px 12px 20px; box-shadow:var(--shadow); position:relative; overflow:hidden; transition:transform .12s, box-shadow .12s, border-color .12s; }
    .bus::before { content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--c); }
    .bus:hover { transform:translateY(-2px); border-color:var(--c); box-shadow:var(--shadow-lg); }
    .bus:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
    .bus-top { display:flex; justify-content:space-between; align-items:center; gap:10px; }
    .num { font-weight:700; font-size:17px; letter-spacing:.2px; }
    .pill { font-size:12px; font-weight:700; padding:4px 10px; border-radius:999px; color:var(--c); background:var(--bg-c); white-space:nowrap; display:inline-flex; align-items:center; gap:6px; }
    .pill::before { content:""; width:7px; height:7px; border-radius:50%; background:var(--c); }
    .route { margin-top:10px; font-size:14px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
    .route .arrow { color:var(--muted); }
    .route.none { color:var(--muted); }
    .meta { margin-top:8px; display:flex; gap:14px; flex-wrap:wrap; color:var(--muted); font-size:12.5px; }
    .more { margin-top:10px; font-size:12px; font-weight:600; color:var(--accent); }
    .running  { --c:var(--ok);   --bg-c:var(--ok-bg); }
    .silent   { --c:var(--warn); --bg-c:var(--warn-bg); }
    .idle     { --c:var(--off);  --bg-c:var(--off-bg); }

    .empty { grid-column:1/-1; text-align:center; color:var(--muted); background:var(--card); border:1px dashed var(--border); border-radius:14px; padding:36px 20px; line-height:1.5; }
    .skeleton { height:112px; border-radius:14px; background:linear-gradient(90deg, var(--card) 25%, var(--card-2) 50%, var(--card) 75%); background-size:200% 100%; animation:shimmer 1.3s infinite; border:1px solid var(--border); }
    @keyframes shimmer { to { background-position:-200% 0; } }
    .banner { display:none; margin-bottom:14px; padding:10px 14px; border-radius:12px; background:var(--warn-bg); color:var(--warn); font-size:13px; font-weight:600; }
    .banner.show { display:block; }

    /* ───── detail drawer ───── */
    .backdrop { position:fixed; inset:0; background:rgba(8,12,20,.45); opacity:0; pointer-events:none; transition:opacity .2s; z-index:40; }
    .backdrop.open { opacity:1; pointer-events:auto; }
    .drawer { position:fixed; top:0; right:0; bottom:0; width:min(460px, 100vw); background:var(--card); z-index:50; box-shadow:var(--shadow-lg);
      transform:translateX(100%); transition:transform .25s ease; display:flex; flex-direction:column; border-left:1px solid var(--border); }
    .drawer.open { transform:none; }
    .d-head { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:16px 18px; padding-top:calc(16px + env(safe-area-inset-top)); border-bottom:1px solid var(--border); }
    .d-head h2 { margin:0 0 6px; font-size:20px; }
    .d-body { overflow-y:auto; padding:16px 18px calc(24px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:16px; }
    .kv { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .kv > div { background:var(--card-2); border:1px solid var(--border); border-radius:12px; padding:10px 12px; }
    .kv .wide { grid-column:1/-1; }
    .kv small { display:block; color:var(--muted); font-size:12px; margin-bottom:3px; }
    .kv b { font-size:15px; }
    .map-wrap { border:1px solid var(--border); border-radius:14px; overflow:hidden; background:var(--card-2); }
    #map { height:250px; }
    .map-note { padding:22px 16px; text-align:center; color:var(--muted); font-size:13px; }
    .map-foot { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:9px 12px; font-size:12.5px; color:var(--muted); border-top:1px solid var(--border); }
    .map-foot a { color:var(--accent); font-weight:600; text-decoration:none; white-space:nowrap; }
    .d-sec h3 { margin:0 0 8px; font-size:13px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); }
    .trip { display:flex; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); font-size:13.5px; }
    .trip:last-child { border-bottom:0; }
    .trip small { color:var(--muted); display:block; margin-top:2px; }
    .trip .tag { align-self:center; font-size:11px; font-weight:700; padding:3px 8px; border-radius:999px; background:var(--ok-bg); color:var(--ok); }
    .bus-marker { width:34px; height:34px; border-radius:50%; background:var(--accent); border:3px solid #fff; box-shadow:0 2px 8px rgba(0,0,0,.4); display:grid; place-items:center; font-size:17px; }
    .bus-marker.silent { background:var(--warn); }

    @media (max-width:700px) {
      .summary { grid-template-columns:repeat(2, 1fr); }
      .drawer { top:auto; width:100%; height:90vh; height:90dvh; border-left:0; border-radius:20px 20px 0 0; transform:translateY(100%); }
      .drawer.open { transform:none; }
      header { padding-left:14px; padding-right:14px; }
    }
    @media (prefers-reduced-motion:reduce) { * { animation:none !important; transition:none !important; } }
  </style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">🚌</div>
    <div>
      <h1 id="title">Depot Dashboard</h1>
      <small><span class="live" id="liveDot"></span><span id="updated">Connecting…</span></small>
    </div>
  </div>
  <div class="head-actions">
    <button class="btn icon" id="themeBtn" type="button" title="Switch theme" aria-label="Switch theme">🌓</button>
    <form action="/logout" method="post" style="margin:0">
      <input type="hidden" name="_csrf" id="csrfToken">
      <button class="btn" type="submit">Sign out</button>
    </form>
  </div>
</header>

<main>
  <div class="banner" id="banner">Connection lost – retrying…</div>

  <section class="summary" aria-label="Summary">
    <div class="stat" style="--c:var(--accent)"><b id="sTotal">–</b><span>Total buses</span></div>
    <div class="stat" style="--c:var(--ok)"><b id="sRunning">–</b><span>Running now</span></div>
    <div class="stat" style="--c:var(--warn)"><b id="sSilent">–</b><span>Not reporting</span></div>
    <div class="stat" style="--c:var(--off)"><b id="sIdle">–</b><span>Idle</span></div>
  </section>

  <div class="toolbar">
    <label class="search"><input id="q" type="search" placeholder="Search bus number or route…" autocomplete="off" aria-label="Search buses"></label>
    <div class="chips" id="chips" role="group" aria-label="Filter by status"></div>
  </div>

  <div class="grid" id="list" aria-live="polite">
    <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
  </div>
</main>

<div class="backdrop" id="backdrop"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle" aria-hidden="true">
  <div class="d-head">
    <div>
      <h2 id="dTitle">–</h2>
      <span class="pill idle" id="dPill">–</span>
    </div>
    <button class="btn icon" id="dClose" type="button" aria-label="Close details">✕</button>
  </div>
  <div class="d-body" id="dBody"></div>
</aside>

<script>
  /* ───────── helpers ───────── */
  const $ = id => document.getElementById(id);
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }
  const STATUS = {
    running: { label: 'Running' },
    silent:  { label: 'Not reporting' },
    idle:    { label: 'Idle' }
  };
  function statusOf(b) { return !b.running ? 'idle' : (b.stale ? 'silent' : 'running'); }

  function ago(seconds) {
    if (seconds == null || seconds < 0) return '–';
    if (seconds < 10) return 'just now';
    if (seconds < 60) return Math.round(seconds) + ' s ago';
    const m = Math.round(seconds / 60);
    if (m < 60) return m + ' min ago';
    const h = Math.floor(m / 60);
    return h + ' h ' + (m % 60) + ' min ago';
  }
  function duration(ms) {
    if (ms == null || ms < 0) return '–';
    const m = Math.round(ms / 60000);
    if (m < 60) return m + ' min';
    return Math.floor(m / 60) + ' h ' + (m % 60) + ' min';
  }
  function clock(ms) {
    if (ms == null) return '–';
    const d = new Date(ms), now = new Date();
    const t = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    return d.toDateString() === now.toDateString() ? t : d.toLocaleDateString([], { day: 'numeric', month: 'short' }) + ', ' + t;
  }
  function routeText(b) { return (b.source || '') + ' ' + (b.destination || ''); }

  /* ───────── theme ───────── */
  (function () {
    let saved = null;
    try { saved = localStorage.getItem('wimb-theme'); } catch (e) {}
    const dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    $('themeBtn').addEventListener('click', () => {
      const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      try { localStorage.setItem('wimb-theme', next); } catch (e) {}
    });
  })();

  fetch('/csrf-token').then(r => r.json()).then(d => { $('csrfToken').value = d.token; }).catch(() => {});

  /* ───────── state ───────── */
  let buses = [];
  let filter = 'all';
  let query = '';
  let selected = null;         // bus number whose drawer is open
  let detailTimer = null;
  let lastFocus = null;

  /* ───────── list ───────── */
  function renderChips(counts) {
    // (no double square brackets anywhere in this file: Thymeleaf would read them as inline expressions)
    const defs = [
      { key: 'all', label: 'All' }, { key: 'running', label: 'Running' },
      { key: 'silent', label: 'Not reporting' }, { key: 'idle', label: 'Idle' }
    ];
    const box = $('chips');
    box.replaceChildren();
    defs.forEach(({ key, label }) => {
      const c = el('button', 'chip', label);
      c.type = 'button';
      c.setAttribute('aria-pressed', String(filter === key));
      c.append(el('span', 'n', counts[key]));
      c.addEventListener('click', () => { filter = key; renderList(); });
      box.append(c);
    });
  }

  function renderList() {
    const counts = { all: buses.length, running: 0, silent: 0, idle: 0 };
    buses.forEach(b => counts[statusOf(b)]++);
    $('sTotal').textContent = counts.all;
    $('sRunning').textContent = counts.running;
    $('sSilent').textContent = counts.silent;
    $('sIdle').textContent = counts.idle;
    renderChips(counts);

    const q = query.trim().toLowerCase();
    const order = { running: 0, silent: 1, idle: 2 };
    const shown = buses
            .filter(b => filter === 'all' || statusOf(b) === filter)
            .filter(b => !q || b.busNumber.toLowerCase().includes(q) || routeText(b).toLowerCase().includes(q))
            .sort((a, b) => (order[statusOf(a)] - order[statusOf(b)]) || a.busNumber.localeCompare(b.busNumber));

    const list = $('list');
    list.replaceChildren();
    if (!buses.length) {
      list.append(el('div', 'empty',
              'No buses in this depot yet. A bus appears here automatically the first time its driver signs in with this depot\u2019s code.'));
      return;
    }
    if (!shown.length) {
      list.append(el('div', 'empty', 'No buses match your search or filter.'));
      return;
    }
    shown.forEach(b => {
      const st = statusOf(b);
      const card = el('button', 'bus ' + st);
      card.type = 'button';
      card.setAttribute('aria-label', 'Open details for bus ' + b.busNumber + ', ' + STATUS[st].label);

      const top = el('div', 'bus-top');
      top.append(el('span', 'num', b.busNumber), el('span', 'pill', STATUS[st].label));
      card.append(top);

      if (b.running) {
        const r = el('div', 'route');
        r.append(el('b', null, b.source || '?'), el('span', 'arrow', '\u2192'), el('b', null, b.destination || '?'));
        card.append(r);
        const meta = el('div', 'meta');
        if (b.remainingDistanceKm != null) meta.append(el('span', null, '\uD83D\uDCCF ' + Number(b.remainingDistanceKm).toFixed(1) + ' km left'));
        if (b.silentSeconds != null) meta.append(el('span', null, '\uD83D\uDCE1 ' + ago(b.silentSeconds)));
        if (meta.childNodes.length) card.append(meta);
      } else {
        card.append(el('div', 'route none', 'Not on a trip'));
      }
      card.append(el('div', 'more', 'View details \u203A'));
      card.addEventListener('click', () => openDrawer(b.busNumber, card));
      list.append(card);
    });
  }

  async function refresh() {
    try {
      const r = await fetch('/depot/api/buses', { cache: 'no-store' });
      if (r.redirected || r.status === 401 || r.status === 403) { location.href = '/login.html'; return; }
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const data = await r.json();
      $('title').textContent = data.depot + ' Depot';
      document.title = data.depot + ' Depot \u2013 WIMB';
      buses = data.buses || [];
      renderList();
      $('banner').classList.remove('show');
      $('liveDot').classList.remove('down');
      $('updated').textContent = 'Live \u00B7 updated ' + new Date().toLocaleTimeString();
    } catch (e) {
      $('banner').classList.add('show');
      $('liveDot').classList.add('down');
      $('updated').textContent = 'Offline \u2013 retrying';
    }
  }

  $('q').addEventListener('input', e => { query = e.target.value; renderList(); });

  /* ───────── drawer + map ───────── */
  let map = null, marker = null, leafletState = 'idle';   // idle | loading | ready | failed
  let leafletWaiters = [];

  function loadLeaflet(cb) {
    if (leafletState === 'ready') return cb(true);
    if (leafletState === 'failed') return cb(false);
    leafletWaiters.push(cb);
    if (leafletState === 'loading') return;
    leafletState = 'loading';
    const css = document.createElement('link');
    css.rel = 'stylesheet';
    css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
    document.head.append(css);
    const js = document.createElement('script');
    js.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
    js.onload = () => { leafletState = 'ready'; leafletWaiters.splice(0).forEach(f => f(true)); };
    js.onerror = () => { leafletState = 'failed'; leafletWaiters.splice(0).forEach(f => f(false)); };
    document.head.append(js);
  }

  function destroyMap() {
    if (map) { map.remove(); map = null; marker = null; }
  }

  function setMarker(lat, lng, silent) {
    loadLeaflet(ok => {
      const holder = $('map');
      if (!holder || !selected) return;    // drawer closed while the map library was loading
      if (!ok) { holder.replaceWith(el('div', 'map-note', 'Map could not be loaded. Use \u201COpen in Google Maps\u201D below.')); return; }
      const icon = L.divIcon({
        className: '', iconSize: [34, 34], iconAnchor: [17, 17],
        html: '<div class="bus-marker' + (silent ? ' silent' : '') + '">\uD83D\uDE8C</div>'
      });
      if (!map) {
        map = L.map(holder, { zoomControl: true, attributionControl: true }).setView([lat, lng], 14);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);
        marker = L.marker([lat, lng], { icon }).addTo(map);
      } else {
        marker.setLatLng([lat, lng]);
        marker.setIcon(icon);
        if (!map.getBounds().contains([lat, lng])) map.panTo([lat, lng]);
      }
    });
  }

  function kv(label, value, wide) {
    const d = el('div', wide ? 'wide' : null);
    d.append(el('small', null, label), el('b', null, value));
    return d;
  }

  function renderDetail(d) {
    const st = !d.running ? 'idle' : (d.stale ? 'silent' : 'running');
    $('dTitle').textContent = d.busNumber;
    const pill = $('dPill');
    pill.className = 'pill ' + st;
    pill.textContent = STATUS[st].label;

    const body = $('dBody');
    const hasPos = d.running && d.latitude != null && d.longitude != null;
    const oldMapWrap = (map && hasPos) ? body.querySelector('.map-wrap') : null;   // keep the live map between refreshes
    if (!oldMapWrap) destroyMap();
    if (oldMapWrap) oldMapWrap.remove();    // detach (not destroy) so Leaflet keeps its state
    body.replaceChildren();

    const grid = el('div', 'kv');
    if (d.running) {
      grid.append(kv('Route', (d.source || '?') + ' \u2192 ' + (d.destination || '?'), true));
      grid.append(kv('Trip started', clock(d.startedAt)));
      grid.append(kv('Running for', duration(d.startedAt ? Date.now() - d.startedAt : null)));
      grid.append(kv('Last update', d.lastUpdate ? ago((Date.now() - d.lastUpdate) / 1000) : (d.silentSeconds != null ? ago(d.silentSeconds) : '–')));
      grid.append(kv('Depot', d.depot));
    } else {
      grid.append(kv('Current status', 'Not on a trip', true));
      grid.append(kv('Depot', d.depot, true));
    }
    body.append(grid);

    if (d.running) {
      if (hasPos) {
        const wrap = oldMapWrap || (() => {
          const w = el('div', 'map-wrap');
          const m = el('div'); m.id = 'map';
          w.append(m);
          return w;
        })();
        let foot = wrap.querySelector('.map-foot');
        if (!foot) { foot = el('div', 'map-foot'); wrap.append(foot); }
        foot.replaceChildren();
        foot.append(el('span', null, d.latitude.toFixed(5) + ', ' + d.longitude.toFixed(5)));
        const a = el('a', null, 'Open in Google Maps \u2197');
        a.href = 'https://www.google.com/maps?q=' + encodeURIComponent(d.latitude + ',' + d.longitude);
        a.target = '_blank'; a.rel = 'noopener noreferrer';
        foot.append(a);
        body.append(wrap);
        if (oldMapWrap && map) map.invalidateSize();
        setMarker(d.latitude, d.longitude, d.stale);
      } else {
        const w = el('div', 'map-wrap');
        w.append(el('div', 'map-note', 'Waiting for the first GPS location from this bus\u2026'));
        body.append(w);
      }
    }

    const sec = el('div', 'd-sec');
    sec.append(el('h3', null, 'Recent trips'));
    const trips = d.recentTrips || [];
    if (!trips.length) sec.append(el('div', 'map-note', 'No trips recorded yet.'));
    trips.forEach(t => {
      const row = el('div', 'trip');
      const left = el('div');
      left.append(el('b', null, (t.source || '?') + ' \u2192 ' + (t.destination || '?')));
      const when = clock(t.startedAt) + (t.endedAt ? ' \u2013 ' + clock(t.endedAt) + ' (' + duration(t.endedAt - t.startedAt) + ')' : '');
      left.append(el('small', null, when));
      row.append(left);
      if (t.active) row.append(el('span', 'tag', 'LIVE'));
      sec.append(row);
    });
    body.append(sec);
  }

  async function loadDetail(number, first) {
    try {
      const r = await fetch('/depot/api/bus?number=' + encodeURIComponent(number), { cache: 'no-store' });
      if (r.redirected || r.status === 401 || r.status === 403) { location.href = '/login.html'; return; }
      if (selected !== number) return;                       // drawer was closed / switched meanwhile
      if (r.status === 404) {
        $('dBody').replaceChildren(el('div', 'map-note', 'This bus is no longer part of your depot.'));
        return;
      }
      if (!r.ok) throw new Error();
      renderDetail(await r.json());
    } catch (e) {
      if (first && selected === number) $('dBody').replaceChildren(el('div', 'map-note', 'Could not load details. Retrying\u2026'));
    }
  }

  function openDrawer(number, trigger) {
    selected = number;
    lastFocus = trigger || null;
    destroyMap();
    $('dTitle').textContent = number;
    $('dPill').className = 'pill idle';
    $('dPill').textContent = 'Loading\u2026';
    $('dBody').replaceChildren(el('div', 'skeleton'), el('div', 'skeleton'));
    $('drawer').classList.add('open');
    $('backdrop').classList.add('open');
    $('drawer').setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    $('dClose').focus();
    loadDetail(number, true);
    clearInterval(detailTimer);
    detailTimer = setInterval(() => { if (selected) loadDetail(selected, false); }, 5000);
  }

  function closeDrawer() {
    selected = null;
    clearInterval(detailTimer);
    $('drawer').classList.remove('open');
    $('backdrop').classList.remove('open');
    $('drawer').setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    destroyMap();
    if (lastFocus && document.body.contains(lastFocus)) lastFocus.focus();
  }

  $('dClose').addEventListener('click', closeDrawer);
  $('backdrop').addEventListener('click', closeDrawer);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && selected) closeDrawer(); });

  refresh();
  setInterval(refresh, 10000);
</script>
</body>
</html>
