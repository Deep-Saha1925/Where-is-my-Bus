<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Driver Panel | WIMB</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">

<div class="bg-white rounded-2xl shadow-xl w-full max-w-lg p-8">

    <!-- Header -->
    <div class="flex items-center justify-center gap-3 mb-7">
        <div class="bg-blue-600 text-white rounded-full w-10 h-10 flex items-center justify-center text-lg">🚌</div>
        <h2 class="text-2xl font-bold text-gray-800">Driver Panel</h2>
    </div>

    <!-- STEP 1: Bus Number -->
    <div id="busNumberSection">
        <label class="block text-sm font-semibold text-gray-600 mb-1">Bus Number</label>
        <input
                id="busNumber"
                type="text"
                required
                class="w-full border border-gray-300 rounded-lg p-3 text-sm bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-400 mb-4"
                placeholder="Enter Bus Number (WB-23A-1245)"
        />
        <button
                onclick="checkBus()"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition"
        >
            Continue →
        </button>
    </div>

    <!-- STEP 2a: Active ride found -->
    <div id="resumeSection" class="hidden">
        <div class="bg-yellow-50 border border-yellow-300 rounded-xl p-5 mb-4">
            <p class="text-sm font-bold text-yellow-800 mb-3">🚌 Active ride found for this bus</p>
            <div class="text-sm text-gray-700 space-y-2 mb-5">
                <div class="flex justify-between bg-white rounded-lg px-4 py-2 border border-yellow-200">
                    <span class="text-gray-500">Route</span>
                    <b id="savedRouteKey" class="text-gray-800"></b>
                </div>
                <div class="flex justify-between bg-white rounded-lg px-4 py-2 border border-yellow-200">
                    <span class="text-gray-500">Ride ID</span>
                    <b id="savedRideId" class="text-gray-800"></b>
                </div>
            </div>
            <button
                    onclick="resumeRide()"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg mb-2 transition"
            >
                ↩ Resume & End This Ride
            </button>
            <button
                    onclick="showNewRideForm()"
                    class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium py-3 rounded-lg transition"
            >
                ＋ Start New Ride Instead
            </button>
        </div>
    </div>

    <!-- STEP 2b: New ride form -->
    <div id="newRideSection" class="hidden">
        <label class="block text-sm font-semibold text-gray-600 mb-1">Start Location</label>
        <input
                id="source"
                list="stopsList"
                placeholder="Type source stop"
                class="w-full border border-gray-300 rounded-lg p-3 text-sm bg-gray-50 focus:outline-none focus:ring-2 focus:ring-green-400 mb-4"
                required
        />

        <label class="block text-sm font-semibold text-gray-600 mb-1">Destination</label>
        <input
                id="destination"
                list="stopsList"
                placeholder="Type destination stop"
                class="w-full border border-gray-300 rounded-lg p-3 text-sm bg-gray-50 focus:outline-none focus:ring-2 focus:ring-green-400 mb-5"
                required
        />

        <datalist id="stopsList"></datalist>

        <button
                id="startBtn"
                onclick="startRide()"
                class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-lg transition"
        >
            🚦 Start Ride
        </button>
    </div>

    <!-- STEP 3: Ride active -->
    <div id="activeRideSection" class="hidden">
        <div class="bg-green-50 border border-green-300 rounded-xl p-5 mb-4">
            <div class="flex items-center gap-2 mb-4">
                <span class="w-3 h-3 bg-green-500 rounded-full animate-pulse inline-block"></span>
                <p class="text-sm font-bold text-green-800">Ride is Active</p>
            </div>
            <div class="space-y-2 text-sm">
                <div class="flex justify-between bg-white rounded-lg px-4 py-2 border border-green-200">
                    <span class="text-gray-500">Bus Number</span>
                    <b id="activeBusNumber" class="text-gray-800"></b>
                </div>
                <div class="flex justify-between bg-white rounded-lg px-4 py-2 border border-green-200">
                    <span class="text-gray-500">Route</span>
                    <b id="activeRouteKey" class="text-gray-800"></b>
                </div>
                <div class="flex justify-between bg-white rounded-lg px-4 py-2 border border-green-200">
                    <span class="text-gray-500">Ride ID</span>
                    <b id="activeRideId" class="text-gray-800"></b>
                </div>
            </div>
        </div>
        <button
                id="stopBtn"
                onclick="stopRide()"
                class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-3 rounded-lg transition"
        >
            🛑 Stop Ride
        </button>
    </div>

    <p id="status" class="text-center text-sm text-gray-500 mt-5"></p>
</div>

<script src="/js/driver.js"></script>
</body>
</html>
