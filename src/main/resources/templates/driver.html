<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Driver Panel | WIMB</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

<div class="bg-white p-6 rounded-xl shadow-lg w-96">

    <h2 class="text-xl font-bold mb-4 text-center">Driver Panel</h2>

    <!-- STEP 1: Enter bus number only -->
    <div id="busNumberSection">
        <label class="block text-sm font-medium">Bus Number</label>
        <input
                id="busNumber"
                type="text"
                required
                class="w-full border rounded p-2 mt-2 mb-3 bg-gray-100"
                placeholder="Enter Bus Number (WB-23A-1245)"
        />
        <button
                onclick="checkBus()"
                class="w-full bg-blue-600 text-white py-2 rounded"
        >
            Continue →
        </button>
    </div>

    <!-- STEP 2a: Active ride found — resume or start new -->
    <div id="resumeSection" class="hidden">
        <div class="bg-yellow-50 border border-yellow-300 rounded-lg p-4 mb-4">
            <p class="text-sm font-semibold text-yellow-800 mb-3">🚌 Active ride found for this bus</p>
            <div class="text-sm text-gray-700 space-y-1 mb-4">
                <p>Route: <b id="savedRouteKey"></b></p>
                <p>Ride ID: <b id="savedRideId"></b></p>
            </div>
            <button
                    onclick="resumeRide()"
                    class="w-full bg-blue-600 text-white py-2 rounded mb-2 hover:bg-blue-700"
            >
                ↩ Resume & End This Ride
            </button>
            <button
                    onclick="showNewRideForm()"
                    class="w-full bg-gray-200 text-gray-700 py-2 rounded hover:bg-gray-300"
            >
                ＋ Start New Ride Instead
            </button>
        </div>
    </div>

    <!-- STEP 2b: No active ride — show full form -->
    <div id="newRideSection" class="hidden">
        <label class="block text-sm font-medium">Start Location</label>
        <input
                id="source"
                list="stopsList"
                placeholder="Type source"
                class="w-full border rounded p-2 mt-2 mb-3 bg-gray-100"
                required
        />

        <label class="block text-sm font-medium">Destination</label>
        <input
                id="destination"
                list="stopsList"
                placeholder="Type destination"
                class="w-full border rounded p-2 mt-2 mb-3 bg-gray-100"
                required
        />

        <datalist id="stopsList"></datalist>

        <button
                id="startBtn"
                onclick="startRide()"
                class="w-full bg-green-600 text-white py-2 rounded mb-3"
        >
            Start Ride
        </button>
    </div>

    <!-- STEP 3: Ride active — only stop button shown -->
    <div id="activeRideSection" class="hidden">
        <div class="bg-green-50 border border-green-300 rounded-lg p-3 mb-3 text-sm text-green-800">
            <p>🟢 Ride is active</p>
            <p class="mt-1">Route: <b id="activeRouteKey"></b></p>
            <p>Ride ID: <b id="activeRideId"></b></p>
            <p>Bus Number: <b id="activeBusNumber"></b></p>
        </div>
        <button
                id="stopBtn"
                onclick="stopRide()"
                class="w-full bg-red-600 text-white py-2 rounded"
        >
            Stop Ride
        </button>
    </div>

    <p id="status" class="text-center text-sm text-gray-600 mt-3"></p>
</div>

<script src="/js/driver.js"></script>
</body>
</html>
