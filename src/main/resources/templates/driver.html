    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-page:     #eef1ec;
            --bg-card:     #ffffff;
            --border:      #dbe2da;
            --text-primary:#16261f;
            --text-muted:  #5c6b62;
            --text-faint:  #8a978d;
            --line-done:   #1f6f5c;   /* teal — secondary brand accent */
            --accent:      #e2892f;   /* amber — primary brand accent */
            --accent-soft: rgba(226,137,47,0.14);
            --teal-soft:   rgba(31,111,92,0.13);
            --shadow:      0 1px 3px rgba(22,38,31,0.07), 0 14px 32px -18px rgba(22,38,31,0.35);
        }

        * { box-sizing: border-box; }

        body {
            background: var(--bg-page);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            min-height: 100dvh;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .eyebrow {
            font-family: 'Oswald', sans-serif;
            font-weight: 600;
            letter-spacing: 0.02em;
        }
        .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

        .brand-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: var(--shadow);
        }

        .brand-label {
            display: block;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .brand-input, .brand-select {
            width: 100%;
            padding: 12px 14px;
            font-size: 15px;
            border: 1px solid var(--border);
            border-radius: 11px;
            background: var(--bg-page);
            color: var(--text-primary);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .brand-input::placeholder { color: var(--text-faint); }
        .brand-input:focus, .brand-select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
            background: var(--bg-card);
        }

        .brand-btn {
            width: 100%;
            padding: 13px;
            border-radius: 12px;
            border: none;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: filter 0.2s, transform 0.1s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .brand-btn:active { transform: scale(0.98); }
        .brand-btn:hover { filter: brightness(0.94); }

        .btn-amber { background: var(--accent); color: #fff; }
        .btn-teal  { background: var(--line-done); color: #fff; }
        .btn-ghost { background: var(--bg-page); color: var(--text-muted); border: 1px solid var(--border); }
        .btn-danger { background: #dc2626; color: #fff; }

        .info-row {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 10px; padding: 10px 14px; font-size: 13.5px;
        }
        .info-row .label { color: var(--text-faint); }
        .info-row .value { font-family: 'JetBrains Mono', monospace; font-weight: 600; color: var(--text-primary); }

        .panel-amber { background: var(--accent-soft); border: 1px solid rgba(226,137,47,0.3); border-radius: 16px; padding: 18px; }
        .panel-teal  { background: var(--teal-soft); border: 1px solid rgba(31,111,92,0.3); border-radius: 16px; padding: 18px; }

        .status-text { text-align: center; font-size: 13px; color: var(--text-muted); margin-top: 18px; min-height: 18px; }

        .toggle-eye-btn {
            position: absolute; inset: 0 0 0 auto;
            display: flex; align-items: center; padding: 0 12px;
            color: var(--text-faint); background: none; border: none; cursor: pointer;
        }
        .toggle-eye-btn:hover { color: var(--text-muted); }

        @media (max-width: 400px) {
            .outer-wrap { padding: 14px !important; }
            .brand-card { padding: 22px 18px !important; border-radius: 16px; }
        }
    </style>
</head>

<body class="outer-wrap min-h-screen flex items-center justify-center p-6">

<div class="brand-card w-full max-w-lg p-8">

    <!-- Header -->
    <div class="flex items-center justify-center gap-3 mb-7">
        <div style="width:42px; height:42px; border-radius:50%; background:var(--teal-soft); display:flex; align-items:center; justify-content:center; font-size:20px;">🚌</div>
        <div>
            <h2 class="eyebrow" style="font-size:19px; color:var(--text-primary); margin:0;">Driver Panel</h2>
            <div style="font-size:12px; color:var(--text-faint);">Where Is My Bus</div>
        </div>
    </div>

    <!-- STEP 1: Bus Number -->
    <div id="busNumberSection">
        <label class="brand-label">Bus Number</label>
        <input
                id="busNumber"
                type="text"
                required
                class="brand-input mb-4"
                placeholder="Enter Bus Number (WB-23A-1245)"
        />

        <label class="brand-label">Your Depot</label>
        <select
                id="depotName"
                required
                class="brand-select mb-4"
        >
            <option value="" disabled selected>Loading depots...</option>
        </select>

        <label class="brand-label">Depot Code</label>
        <div class="relative mb-1">
            <input
                    id="driverCode"
                    type="password"
                    inputmode="numeric"
                    class="brand-input"
                    style="padding-right:44px;"
                    placeholder="Code for your depot"
            />
            <button
                    type="button"
                    id="toggleCodeBtn"
                    onclick="toggleDriverCodeVisibility()"
                    aria-label="Show driver code"
                    aria-pressed="false"
                    class="toggle-eye-btn"
            >
                <!-- eye (closed / show) icon -->
                <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                     class="w-5 h-5">
                    <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>
                <!-- eye-off (open / hide) icon -->
                <svg id="eyeOffIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                     class="w-5 h-5 hidden">
                    <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a18.6 18.6 0 0 1 5.06-5.94M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                    <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
            </button>
        </div>
        <p style="font-size:12px; color:var(--text-faint); margin:6px 0 18px;">Ask your depot office for this code. Only needed once per shift on this device.</p>

        <button onclick="checkBus()" class="brand-btn btn-amber">
            Continue →
        </button>
    </div>

    <!-- STEP 2a: Active ride found -->
    <div id="resumeSection" class="hidden">
        <div class="panel-amber mb-4">
            <p class="eyebrow" style="font-size:13.5px; color:var(--text-primary); margin:0 0 12px;">🚌 Active ride found for this bus</p>
            <div style="display:flex; flex-direction:column; gap:8px; margin-bottom:18px;">
                <div class="info-row">
                    <span class="label">Route</span>
                    <span class="value" id="savedRouteKey"></span>
                </div>
                <div class="info-row">
                    <span class="label">Ride ID</span>
                    <span class="value" id="savedRideId"></span>
                </div>
            </div>
            <button onclick="resumeRide()" class="brand-btn btn-amber mb-2">
                ↩ Resume &amp; End This Ride
            </button>
            <button onclick="showNewRideForm()" class="brand-btn btn-ghost">
                ＋ Start New Ride Instead
            </button>
        </div>
    </div>

    <!-- STEP 2b: New ride form -->
    <div id="newRideSection" class="hidden">
        <label class="brand-label">Start Location</label>
        <input
                id="source"
                list="stopsList"
                placeholder="Type source stop"
                class="brand-input mb-4"
                required
        />

        <label class="brand-label">Destination</label>
        <input
                id="destination"
                list="stopsList"
                placeholder="Type destination stop"
                class="brand-input mb-5"
                required
        />

        <datalist id="stopsList"></datalist>

        <button id="startBtn" onclick="startRide()" class="brand-btn btn-teal">
            🚦 Start Ride
        </button>
    </div>

    <!-- STEP 3: Ride active -->
    <div id="activeRideSection" class="hidden">
        <div class="panel-teal mb-4">
            <div style="display:flex; align-items:center; gap:8px; margin-bottom:14px;">
                <span style="width:10px; height:10px; background:#10b981; border-radius:50%;" class="animate-pulse"></span>
                <p class="eyebrow" style="font-size:13.5px; color:var(--text-primary); margin:0;">Ride is Active</p>
            </div>
            <div style="display:flex; flex-direction:column; gap:8px;">
                <div class="info-row">
                    <span class="label">Bus Number</span>
                    <span class="value" id="activeBusNumber"></span>
                </div>
                <div class="info-row">
                    <span class="label">Route</span>
                    <span class="value" id="activeRouteKey"></span>
                </div>
                <div class="info-row">
                    <span class="label">Ride ID</span>
                    <span class="value" id="activeRideId"></span>
                </div>
            </div>
        </div>
        <button id="stopBtn" onclick="stopRide()" class="brand-btn btn-danger">
            🛑 Stop Ride
        </button>
    </div>

    <p id="status" class="status-text"></p>
</div>

<script src="/js/driver.js"></script>
</body>
</html>
