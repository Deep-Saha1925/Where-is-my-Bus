    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page:     #eef1ec;
            --bg-card:     #ffffff;
            --bg-header:   #0f1f18;
            --border:      #dbe2da;
            --border-stop: #eef1ec;
            --text-primary:#16261f;
            --text-muted:  #5c6b62;
            --text-faint:  #8a978d;
            --line-done:   #1f6f5c;
            --line-empty:  #dde3d8;
            --dot-future:  #dde3d8;
            --dot-border:  #b8c3b7;
            --accent:      #e2892f;
            --accent-soft: rgba(226,137,47,0.15);
            --shadow:      0 1px 3px rgba(22,38,31,0.07), 0 10px 26px -18px rgba(22,38,31,0.35);
        }

        .dark-mode {
            --bg-page:     #0b1410;
            --bg-card:     #121e18;
            --bg-header:   #0a1712;
            --border:      #223129;
            --border-stop: #121e18;
            --text-primary:#eef3ee;
            --text-muted:  #93a599;
            --text-faint:  #647a6c;
            --line-done:   #45b294;
            --line-empty:  #223129;
            --dot-future:  #223129;
            --dot-border:  #34493d;
            --accent:      #f0a24a;
            --accent-soft: rgba(240,162,74,0.18);
            --shadow:      0 1px 3px rgba(0,0,0,0.4), 0 12px 28px -18px rgba(0,0,0,0.65);
        }

        * { box-sizing: border-box; transition: background-color 0.3s, color 0.3s, border-color 0.3s; }

        body {
            background: var(--bg-page);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
        }

        .num, .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
        .eyebrow {
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.09em;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: var(--shadow);
        }

        /* ── Header / destination-board ── */
        .header-bar {
            background:
                    radial-gradient(120% 220% at 0% 0%, rgba(31,111,92,0.35), transparent 60%),
                    linear-gradient(155deg, #142a20, var(--bg-header) 70%);
            border-bottom: 1px solid #06120c;
            position: sticky; top: 0; z-index: 20;
        }
        .header-bar::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background-image: repeating-linear-gradient(180deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 3px);
            opacity: .5;
        }
        .back-btn {
            color: rgba(255,255,255,0.72);
            font-size: 20px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            width: 32px; height: 32px;
            border-radius: 9px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            line-height: 1;
            flex-shrink: 0;
        }
        .back-btn:hover { color: #fff; background: rgba(255,255,255,0.12); }

        #routeTitle {
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-weight: 700;
            font-size: 16px;
            letter-spacing: 0.03em;
            color: #ffc069;
            text-shadow: 0 0 10px rgba(255,180,84,0.45), 0 0 1px rgba(255,180,84,0.6);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        #lastUpdated {
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 11px;
            color: rgba(191,214,201,0.55);
            margin-top: 3px;
            letter-spacing: 0.02em;
        }

        /* ── Progress bar ── */
        .progress-track {
            height: 8px;
            background: var(--line-empty);
            border-radius: 5px;
            overflow: hidden;
            margin-top: 14px;
            position: relative;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--line-done), var(--accent));
            border-radius: 5px;
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        .progress-fill::after {
            content: '';
            position: absolute; inset: 0;
            background-image: repeating-linear-gradient(90deg, rgba(255,255,255,0.4) 0 6px, transparent 6px 14px);
            opacity: 0.45;
        }

        /* ── Timeline line segments (road) ── */
        .line-seg {
            width: 3px;
            flex: 1;
            border-radius: 2px;
            min-height: 22px;
            transition: background-color 0.5s ease, opacity 0.5s ease;
        }
        .line-done  {
            background-color: var(--line-done);
            background-image: repeating-linear-gradient(to bottom, rgba(255,255,255,0.5) 0 5px, transparent 5px 11px);
        }
        .line-empty { background: var(--line-empty); opacity: 0.7; }

        /* ── Dots (stop / mile markers) ── */
        .dot {
            width: 14px; height: 14px;
            border-radius: 50%;
            border: 2px solid var(--dot-border);
            background: var(--dot-future);
            flex-shrink: 0;
            transition: all 0.4s ease;
        }
        .dot-done {
            background: var(--line-done);
            border-color: var(--line-done);
        }
        .dot-current {
            width: 18px; height: 18px;
            background: var(--bg-card);
            border: 2.5px solid var(--accent);
            box-shadow: 0 0 0 4px var(--accent-soft);
            animation: ringPulse 2s ease-in-out infinite;
        }
        .dot-endpoint {
            border-radius: 4px;
        }

        /* ── Bus icon ── */
        .bus-icon {
            position: absolute;
            left: -22px;
            font-size: 21px;
            animation: busFloat 1s ease-in-out infinite alternate,
            busPulse 2s ease-in-out infinite;
            filter: drop-shadow(0 2px 4px rgba(226,137,47,0.45));
        }
        .dark-mode .bus-icon {
            filter: drop-shadow(0 2px 8px rgba(240,162,74,0.6));
        }

        /* ── Stop rows ── */
        .stop-row {
            display: flex;
            align-items: stretch;
            padding: 0 18px;
            border-bottom: 1px solid var(--border-stop);
            transition: background-color 0.3s, opacity 0.3s;
        }
        .stop-row:last-child { border-bottom: none; }
        .stop-row.row-current { background: var(--accent-soft); }
        .stop-row.row-passed { opacity: 0.58; }
        /* Entrance animation — applied only on the very first render.
           Kept off the base .stop-row rule so the 3s live-refresh
           doesn't replay a slide-in on every row each tick. */
        .stop-row.row-enter {
            animation: fadeSlideIn 0.4s ease both;
        }

        /* ── Badges ── */
        .badge {
            font-size: 11.5px;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 20px;
            margin-left: auto;
            white-space: nowrap;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
        }
        .badge-passed  { background: rgba(120,132,124,0.14); color: var(--text-faint); }
        .badge-here    { background: var(--accent-soft); color: var(--accent); animation: badgePulse 2s ease-in-out infinite; font-weight: 700; }
        .badge-arriving{ background: rgba(240,162,74,0.16); color: #b5651d; }
        .dark-mode .badge-arriving { color: #f6b96a; }
        .badge-eta     { background: rgba(120,132,124,0.12); color: var(--text-muted); font-family: 'JetBrains Mono', monospace; font-size: 11px; }
        .badge-src     { background: rgba(31,111,92,0.14); color: var(--line-done); font-size: 10.5px; font-family: 'Oswald', sans-serif; letter-spacing: 0.04em; text-transform: uppercase; }
        .badge-dest    { background: var(--accent-soft); color: var(--accent); font-size: 10.5px; font-family: 'Oswald', sans-serif; letter-spacing: 0.04em; text-transform: uppercase; }
        .dark-mode .badge-src  { color: #6fd6b4; }

        /* ── Live badge (sits on the dark header board) ──
           display is controlled by track.js toggling Tailwind's
           "hidden" / "flex" utility classes, not by this rule */
        .live-badge {
            align-items: center;
            gap: 5px;
            background: rgba(69,178,148,0.18);
            color: #6fe3bf;
            font-size: 11.5px;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            padding: 5px 11px;
            border-radius: 20px;
            border: 1px solid rgba(111,227,191,0.25);
        }
        .live-dot {
            width: 7px; height: 7px;
            background: #4fe3ba;
            border-radius: 50%;
            animation: livePulse 1.4s ease-in-out infinite;
            box-shadow: 0 0 6px rgba(79,227,186,0.8);
        }

        /* ── Theme toggle (fixed for dark header) ── */
        .theme-btn {
            width: 32px; height: 32px;
            border-radius: 9px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.06);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 15px;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .theme-btn:hover  { background: rgba(255,255,255,0.12); transform: scale(1.06); }
        .theme-btn:active { transform: scale(0.95); }

        /* ── Stat cards ── */
        .stat-card {
            background: var(--bg-page);
            border-radius: 10px;
            padding: 12px 14px;
            flex: 1;
        }
        .stat-label {
            font-family: 'Oswald', sans-serif;
            font-size: 10.5px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-faint);
            margin-bottom: 5px;
        }
        .stat-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.2;
        }
        #currentStopDisplay { font-family: 'Inter', sans-serif; font-weight: 700; }

        /* ── Section label ── */
        .section-label {
            padding: 13px 18px 10px;
            border-bottom: 1px solid var(--border);
            font-family: 'Oswald', sans-serif;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.09em;
            color: var(--text-muted);
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-label::before {
            content: '';
            width: 6px; height: 6px;
            border-radius: 1px;
            background: var(--accent);
            display: inline-block;
        }

        /* ── Banner ── */
        .banner {
            padding: 12px 16px;
            border-bottom: 1px solid;
            display: flex; align-items: center; gap: 10px;
            font-size: 13px;
            font-weight: 500;
        }
        .banner-yellow {
            background: rgba(226,137,47,0.09);
            border-color: rgba(226,137,47,0.22);
            color: #a3611b;
        }
        .dark-mode .banner-yellow {
            background: rgba(240,162,74,0.09);
            border-color: rgba(240,162,74,0.18);
            color: #f0a24a;
        }

        /* ── Keyframes ── */
        @keyframes ringPulse {
            0%,100% { box-shadow: 0 0 0 4px var(--accent-soft); }
            50%      { box-shadow: 0 0 0 8px transparent; }
        }
        @keyframes busFloat {
            0%   { transform: translateY(0px); }
            100% { transform: translateY(-4px); }
        }
        @keyframes busPulse {
            0%,100% { filter: drop-shadow(0 2px 4px rgba(226,137,47,0.4)); }
            50%     { filter: drop-shadow(0 4px 10px rgba(226,137,47,0.7)); }
        }
        @keyframes livePulse {
            0%,100% { opacity: 1; transform: scale(1); }
            50%     { opacity: 0.4; transform: scale(0.85); }
        }
        @keyframes badgePulse {
            0%,100% { opacity: 1; }
            50%     { opacity: 0.6; }
        }
        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateX(-8px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition-duration: 0.01ms !important;
            }
        }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }
    </style>
</head>
<body id="appBody">

<!-- ── STICKY HEADER — styled like an LED bus destination board ── -->
<div class="header-bar px-4 py-3 flex items-center gap-3" style="position:relative;">
    <button onclick="goBack()" class="back-btn" aria-label="Go back">←</button>

    <div class="flex-1 min-w-0" style="position:relative; z-index:1;">
        <div id="routeTitle">Loading route...</div>
        <div id="lastUpdated">Fetching location...</div>
    </div>

    <div class="live-badge hidden" id="liveBadge" style="position:relative; z-index:1;">
        <span class="live-dot"></span> Live
    </div>

    <button class="theme-btn" onclick="toggleTheme()" id="themeBtn"
            aria-label="Toggle dark mode" style="position:relative; z-index:1;">🌙</button>
</div>

<!-- ── INFO CARD ── -->
<div style="padding:12px 12px 0;">
    <div class="card" style="padding:16px;">

        <div style="display:flex; justify-content:space-between; gap:8px;">
            <div class="stat-card">
                <div class="stat-label">Bus</div>
                <div class="stat-value" id="busNumberDisplay">—</div>
            </div>
            <div class="stat-card" style="text-align:center;">
                <div class="stat-label">Current stop</div>
                <div class="stat-value" style="color:var(--accent); font-size:14px;" id="currentStopDisplay">—</div>
            </div>
            <div class="stat-card" style="text-align:right;">
                <div class="stat-label">Remaining</div>
                <div class="stat-value" id="remainingDisplay">—</div>
            </div>
        </div>

        <div class="progress-track">
            <div class="progress-fill" id="progressBar" style="width:0%"></div>
        </div>
        <div style="display:flex; justify-content:space-between; margin-top:6px;">
            <span class="eyebrow" style="font-size:10.5px; font-weight:500; color:var(--text-muted);" id="progressStart">—</span>
            <span class="num" style="font-size:12px; font-weight:700; color:var(--accent);" id="progressPct">0%</span>
            <span class="eyebrow" style="font-size:10.5px; font-weight:500; color:var(--text-muted);" id="progressEnd">—</span>
        </div>
    </div>
</div>

<!-- ── ROUTE TIMELINE ── -->
<div style="padding:12px 12px 24px;">
    <div class="card" style="overflow:hidden;">
        <div class="section-label">Route stops</div>
        <div id="stopList">
            <div style="padding:32px 16px; text-align:center; font-size:14px; color:var(--text-faint);">
                Loading stops...
            </div>
        </div>
    </div>
</div>

<script src="/js/track.js"></script>
<script>
    const body     = document.getElementById("appBody");
    const themeBtn = document.getElementById("themeBtn");
    let isDark     = localStorage.getItem("wimb_theme") === "dark";

    function applyTheme() {
        if (isDark) {
            body.classList.add("dark-mode");
            themeBtn.textContent = "☀️";
        } else {
            body.classList.remove("dark-mode");
            themeBtn.textContent = "🌙";
        }
    }

    function toggleTheme() {
        isDark = !isDark;
        localStorage.setItem("wimb_theme", isDark ? "dark" : "light");
        applyTheme();
    }

    applyTheme();
</script>
</body>
</html>
