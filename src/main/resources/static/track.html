<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Track Bus | WIMB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
        @keyframes float { 0%{transform:translateY(0)} 100%{transform:translateY(-4px)} }
        .live-dot { animation: pulse 1.4s ease-in-out infinite; }
        .bus-float { animation: float 0.9s ease-in-out infinite alternate; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

<!-- HEADER BAR -->
<div class="bg-white border-b border-gray-200 px-4 py-3 flex items-center gap-3 sticky top-0 z-10">
    <button onclick="goBack()" class="text-gray-500 hover:text-gray-800 text-lg">←</button>
    <div class="flex-1">
        <div class="font-semibold text-gray-800 text-sm" id="routeTitle">Loading route...</div>
        <div class="text-xs text-gray-400" id="lastUpdated">Fetching location...</div>
    </div>
    <div id="liveBadge" class="hidden items-center gap-1 bg-green-100 text-green-700 text-xs font-medium px-2 py-1 rounded-full">
        <span class="live-dot w-2 h-2 bg-green-500 rounded-full inline-block"></span>
        Live
    </div>
</div>

<!-- INFO CARD -->
<div class="mx-3 mt-3 bg-white rounded-xl border border-gray-200 p-4">
    <div class="flex justify-between items-center mb-2">
        <div>
            <div class="text-xs text-gray-400 mb-0.5">Bus Number</div>
            <div class="font-semibold text-gray-800 text-sm" id="busNumberDisplay">—</div>
        </div>
        <div class="text-center">
            <div class="text-xs text-gray-400 mb-0.5">Current Stop</div>
            <div class="font-semibold text-blue-600 text-sm" id="currentStopDisplay">—</div>
        </div>
        <div class="text-right">
            <div class="text-xs text-gray-400 mb-0.5">Remaining</div>
            <div class="font-semibold text-gray-800 text-sm" id="remainingDisplay">—</div>
        </div>
    </div>
    <!-- Progress bar -->
    <div class="h-1.5 bg-gray-100 rounded-full overflow-hidden mt-1">
        <div id="progressBar" class="h-full bg-blue-500 rounded-full transition-all duration-700" style="width:0%"></div>
    </div>
</div>

<!-- ROUTE TIMELINE -->
<div class="mx-3 mt-3 bg-white rounded-xl border border-gray-200 overflow-hidden mb-6">
    <div class="px-4 py-2.5 border-b border-gray-100 text-xs font-medium text-gray-400 uppercase tracking-wide">
        Route Stops
    </div>
    <div id="stopList"></div>
</div>

<script src="/js/track.js"></script>
</body>
</html>
