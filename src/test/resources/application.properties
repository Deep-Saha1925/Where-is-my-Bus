# Used by ALL test runs (./mvnw test, with or without -Pextra-tests). This file replaces the real
# application.properties on the test classpath, so tests never need DB_URL, REDIS_HOST, ADMIN_PASSWORD
# etc. (which exist on Render but NOT on GitHub Actions) and never touch a real database, Redis or secret.
spring.application.name=wimb-test

wimb.admin.username=test-admin
wimb.admin.password=Test-Admin-Password-123!
wimb.security.enforce-strong-admin-password=false
wimb.cors.allowed-origins=

wimb.depot.file.path=target/test-data/depot-codes.xlsx
wimb.route.dir=target/test-data/routes

# In-memory H2 database (the repository tests replace the datasource with it automatically)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Never connected to by these tests
spring.data.redis.host=localhost
spring.data.redis.port=6379
# fail fast if anything does try to reach it
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms

wimb.retention.location-days=30
